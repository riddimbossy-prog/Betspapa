name: Transition Safety Branch Patch

on:
  push:
    branches:
      - hard-rule/transition-safety-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hard-rule/transition-safety-gate
          fetch-depth: 0
      - name: Patch production integration points
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return False
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))
              return True

          changed = False
          changed |= replace_once(
              'server/src/services/predictionService.js',
              'import { hydrateProfilesForFixtures } from "./historyHydrationService.js";\n',
              'import { hydrateProfilesForFixtures } from "./historyHydrationService.js";\nimport { loadFixtureTransitionProfiles } from "./transitionSafetyService.js";\n'
          )
          changed |= replace_once(
              'server/src/services/predictionService.js',
              '    redFlags,\n    league: {\n',
              '    redFlags,\n    transitionSafety: cached.get("__transitionProfiles")?.get(Number(fixture.id)) || null,\n    league: {\n'
          )
          changed |= replace_once(
              'server/src/services/predictionService.js',
              '  cached.set("__teams", teams);\n  cached.set("__hydrationByTeam", hydration.byTeamId);\n',
              '  const transitionProfiles = await loadFixtureTransitionProfiles(supabase, predictable);\n\n  cached.set("__teams", teams);\n  cached.set("__hydrationByTeam", hydration.byTeamId);\n  cached.set("__transitionProfiles", transitionProfiles);\n'
          )

          changed |= replace_once(
              'server/src/engine/transitionEngine.js',
              'import { selectSplitFormPick } from "./splitFormEngine.js";\n',
              'import { selectSplitFormPick } from "./splitFormEngine.js";\nimport { applyTransitionSafetyToMarkets } from "./transitionSafetyGate.js";\n'
          )
          changed |= replace_once(
              'server/src/engine/transitionEngine.js',
              '  const mergedMarkets = mergeMarkets(overhaul.markets, support.markets);\n  const classification = classifyPapaSenseMatch(input, overhaul);\n  const markets = auditPapaSenseMarkets(mergedMarkets, input, classification);\n  const enginePicks = buildEngineSuite(markets, overhaul, support, input, classification);\n',
              '  const mergedMarkets = mergeMarkets(overhaul.markets, support.markets);\n  const classification = classifyPapaSenseMatch(input, overhaul);\n  const auditedMarkets = auditPapaSenseMarkets(mergedMarkets, input, classification);\n  const transitionSafety = Object.prototype.hasOwnProperty.call(input, "transitionSafety")\n    ? applyTransitionSafetyToMarkets(auditedMarkets, input.transitionSafety, input)\n    : { markets: auditedMarkets, leakRedirect: false, audit: { enforced: false, reason: "transition-safety-input-not-supplied" } };\n  const markets = transitionSafety.markets;\n  const enginePicks = buildEngineSuite(markets, overhaul, support, input, classification);\n'
          )
          changed |= replace_once(
              'server/src/engine/transitionEngine.js',
              '    decisionTrace,\n    venuePattern: {\n',
              '    decisionTrace,\n    transitionSafety: transitionSafety.audit,\n    venuePattern: {\n'
          )
          changed |= replace_once(
              'server/src/engine/transitionEngine.js',
              '      "Repeated and unavailable engine views are never counted as independent consensus votes."\n',
              '      "Repeated and unavailable engine views are never counted as independent consensus votes.",\n      "Before any team win/not-to-lose selection, the last-five venue-split concede-first, stay-down, score-first, lead-hold and comeback gate must pass; >80% stronger-team concession redirects only to independently qualified BTTS Yes, Over 2.5 or Over 1.5."\n'
          )

          if not changed:
              print('No changes required')
          PY
      - name: Validate syntax and commit
        shell: bash
        run: |
          node --check server/src/engine/transitionSafetyGate.js
          node --check server/src/services/transitionSafetyService.js
          node --check server/src/engine/winsBankerEngine.js
          node --check server/src/services/winsBankerService.js
          node --check server/src/services/predictionService.js
          node --check server/src/engine/transitionEngine.js
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/services/predictionService.js server/src/engine/transitionEngine.js
          git commit -m "Enforce transition safety in PapaSense production flow"
          git push origin HEAD:hard-rule/transition-safety-gate
