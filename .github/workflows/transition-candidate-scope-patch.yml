name: Transition Candidate Scope Patch

on:
  push:
    branches:
      - hard-rule/transition-safety-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hard-rule/transition-safety-gate
      - name: Scope leak redirect to viable side candidates
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('server/src/engine/transitionSafetyGate.js')
          s=p.read_text()
          old='    if (gate.redirectGoals) leakRedirect = true;\n'
          new='    const viableSideCandidate = Boolean(market.qualified) || (market.htftGate?.eligible && market.fallbackEligible !== false);\n    if (gate.redirectGoals && viableSideCandidate) leakRedirect = true;\n'
          if old not in s: raise SystemExit('candidate scope insertion point missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check server/src/engine/transitionSafetyGate.js
          cd server
          npm test
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/engine/transitionSafetyGate.js
          git commit -m "Scope leak redirect to viable team-side candidates"
          git push origin HEAD:hard-rule/transition-safety-gate
