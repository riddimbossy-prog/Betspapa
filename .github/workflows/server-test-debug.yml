name: Server Test Debug

on:
  push:
    branches:
      - hard-rule/transition-safety-gate

permissions:
  contents: write

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hard-rule/transition-safety-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Capture test output
        shell: bash
        run: |
          cd server
          npm ci
          set +e
          npm test > ../ci-test-debug.txt 2>&1
          status=$?
          set -e
          echo "exit_status=$status" >> ../ci-test-debug.txt
      - name: Commit diagnostic output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-test-debug.txt
          git commit -m "Capture BetsPapa server test failure"
          git push origin HEAD:hard-rule/transition-safety-gate
